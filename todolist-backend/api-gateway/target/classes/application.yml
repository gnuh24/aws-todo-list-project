server:
        port: 8080

spring:
        application:
                name: api-gateway

        cloud:
                gateway:
                        routes:
                                -       id: user-service
                                        uri: http://localhost:8081
                                        predicates:
                                                - Path=/api/user/**
                                        metadata:
                                                cors:
                                                        allowedOrigins: "http://localhost:4200"
                                                        allowedMethods: "*"
                                                        allowedHeaders: "*"
                                                        allowCredentials: true

                                -       id: taskflow-service
                                        uri: http://localhost:8082
                                        predicates:
                                                - Path=/api/taskflow/**
                                        metadata:
                                                cors:
                                                        allowedOrigins: "http://localhost:4200"
                                                        allowedMethods: "*"
                                                        allowedHeaders: "*"
                                                        allowCredentials: true

management:
        endpoints:
                web:
                        exposure:
                                include: "*"

logging:
        level:
                org.springframework.cloud.gateway: DEBUG
                org.springframework.web: DEBUG
                org.springframework.security.web.access.ExceptionTranslationFilter: DEBUG

springdoc:
        api-docs:
                enabled: true
        swagger-ui:
                urls:
                        - name: user-service
                          url: http://localhost:8081/api/user/v3/api-docs
                        - name: taskflow-service
                          url: http://localhost:8082/api/taskflow/v3/api-docs
                        - name: auth-service
                          url: http://localhost:9999/api/auth/v3/api-docs
                        - name: notification-service
                          url: http://localhost:9998/api/notification/v3/api-docs