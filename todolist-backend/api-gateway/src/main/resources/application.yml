server:
        port: 8080

spring:
        application:
                name: api-gateway

        cloud:
                gateway:
                        routes:
                                -       id: user-service
                                        uri: http://localhost:8081
                                        predicates:
                                                - Path=/api/user/**
                                        metadata:
                                                cors:
                                                        allowedOrigins: "http://localhost:4200"
                                                        allowedMethods: "*"
                                                        allowedHeaders: "*"
                                                        allowCredentials: true

                                -       id: catalog-service
                                        uri: http://localhost:8082
                                        predicates:
                                                - Path=/api/catalog/**
                                        metadata:
                                                cors:
                                                        allowedOrigins: "http://localhost:4200"
                                                        allowedMethods: "*"
                                                        allowedHeaders: "*"
                                                        allowCredentials: true

                                -       id: order-service
                                        uri: http://localhost:8083
                                        predicates:
                                                - Path=/api/order/**
                                        metadata:
                                                cors:
                                                        allowedOrigins: "http://localhost:4200"
                                                        allowedMethods: "*"
                                                        allowedHeaders: "*"
                                                        allowCredentials: true

                                -       id: news-service
                                        uri: http://localhost:8084
                                        predicates:
                                                - Path=/api/news/**
                                        metadata:
                                                cors:
                                                        allowedOrigins: "http://localhost:4200"
                                                        allowedMethods: "*"
                                                        allowedHeaders: "*"
                                                        allowCredentials: true

management:
        endpoints:
                web:
                        exposure:
                                include: "*"

logging:
        level:
                org.springframework.cloud.gateway: DEBUG
                org.springframework.web: DEBUG
                org.springframework.security.web.access.ExceptionTranslationFilter: DEBUG
