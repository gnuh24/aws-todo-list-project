server:
        port: 8080

spring:
        application:
                name: api-gateway

        # =========================
        # ☁️ Spring Cloud Gateway
        # =========================
        cloud:
                gateway:
                        # 🔹 Global CORS
                        globalcors:
                                add-to-simple-url-handler-mapping: true
                                corsConfigurations:
                                        '[/**]':
                                                allowedOrigins:
                                                        - "http://localhost:4200"
                                                        - "http://127.0.0.1:4200"
                                                        - "http://localhost:5500"
                                                        - "http://127.0.0.1:5500"
                                                        - "http://localhost:3000"
                                                        - "http://127.0.0.1:3000"
                                                allowedMethods:
                                                        - GET
                                                        - POST
                                                        - PUT
                                                        - PATCH
                                                        - DELETE
                                                        - OPTIONS
                                                allowedHeaders: "*"
                                                allowCredentials: true

                        # 🔹 Routes Configuration
                        routes:
                                - id: user-service
                                  uri: http://user-service:8081     # ✅ dùng tên container trong cùng network
                                  predicates:
                                          - Path=/api/user/**
                                  filters:
                                          - name: RequestRateLimiter
                                            args:
                                                    redis-rate-limiter.replenishRate: 5     # Tối đa 5 request / giây
                                                    redis-rate-limiter.burstCapacity: 10    # Cho phép tối đa 10 request dồn
                                                    key-resolver: "#{@ipKeyResolver}"       # Giới hạn theo IP

                                - id: taskflow-service
                                  uri: http://host.docker.internal:8082
                                  predicates:
                                          - Path=/api/taskflow/**
                                  filters:
                                          - name: RequestRateLimiter
                                            args:
                                                    redis-rate-limiter.replenishRate: 5
                                                    redis-rate-limiter.burstCapacity: 10
                                                    key-resolver: "#{@ipKeyResolver}"

                                - id: auth-service
                                  uri: http://auth-service:9999
                                  predicates:
                                          - Path=/api/auth/**
                                  filters:
                                          - name: RequestRateLimiter
                                            args:
                                                    redis-rate-limiter.replenishRate: 10
                                                    redis-rate-limiter.burstCapacity: 20
                                                    key-resolver: "#{@ipKeyResolver}"

#                                                    redis-rate-limiter.replenishRate: 5        # Nạp 5 request mỗi "chu kỳ"
#                                                    redis-rate-limiter.burstCapacity: 5        # Cho phép tối đa 5 request tích lũy
#                                                    redis-rate-limiter.requestedTokens: 1      # Mỗi request lấy 1 token
#                                                    redis-rate-limiter.duration: 60s           # 🔥 Thời gian chu kỳ nạp token = 60 giây
#                                                    key-resolver: "#{@ipKeyResolver}"

                                - id: notification-service
                                  uri: http://host.docker.internal:9998
                                  predicates:
                                          - Path=/api/notification/**
                                  filters:
                                          - name: RequestRateLimiter
                                            args:
                                                    redis-rate-limiter.replenishRate: 5
                                                    redis-rate-limiter.burstCapacity: 10
                                                    key-resolver: "#{@ipKeyResolver}"

        # =========================
        # 🧱 Redis Configuration
        # =========================
        data:
                redis:
                        host: redis
                        port: 6379
                        timeout: 6000
                        lettuce:
                                pool:
                                        max-active: 8
                                        max-idle: 8
                                        min-idle: 0
                                        max-wait: -1ms

# =========================
# ⚙️ Management & Monitoring
# =========================
management:
        endpoints:
                web:
                        exposure:
                                include: "*"
        endpoint:
                health:
                        show-details: always

# =========================
# 📊 Logging Configuration
# =========================
logging:
        org.springframework.cloud.gateway.filter.ratelimit: DEBUG

        file:
                name: logs/api-gateway/dev.log
        level:
                root: INFO
                org.springframework.cloud.gateway: INFO
                org.springframework.web: INFO
                org.springframework.security.web.access.ExceptionTranslationFilter: WARN
                aws.todolist.gateway: DEBUG
        pattern:
                console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
                file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# =========================
# 🧭 SpringDoc Swagger UI (multi-service)
# =========================
springdoc:
        api-docs:
                enabled: true
        swagger-ui:
                urls:
                        - name: user-service
                          url: http://localhost:8081/api/user/v3/api-docs
                        - name: taskflow-service
                          url: http://localhost:8082/api/taskflow/v3/api-docs
                        - name: auth-service
                          url: http://localhost:9999/api/auth/v3/api-docs
                        - name: notification-service
                          url: http://localhost:9998/api/notification/v3/api-docs

