# ====== Kafka Bootstrap Server ======
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}

# ====== Producer Config ======
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3

# ====== Topic Config ======
spring.kafka.consumer.group-id=notification-group
app.kafka.topic.auth.register-email=auth.notification.register-email.v1
app.kafka.topic.auth.reset-password-email=auth.notification.reset-password-email.v1
app.kafka.topic.auth.update-email=auth.notification.update-email.v1

