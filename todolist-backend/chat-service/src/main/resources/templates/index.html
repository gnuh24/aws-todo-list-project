<html>
<head>
    <title>Chat via Gateway</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; }
        input { padding: 5px; width: 300px; margin: 5px 0; }
        button { padding: 5px 15px; cursor: pointer; background: #007bff; color: white; border: none; }
        #messages { list-style: none; padding: 0; }
        #messages li { padding: 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<h2>Chat Service (via API Gateway 8080)</h2>

<div class="box">
    <h3>1. Authentication</h3>
    <label>JWT Token (Login via Postman first):</label><br>
    <input type="text" id="token" placeholder="Paste your Bearer Token here..."><br>
    <button onclick="connect()">Connect to WebSocket</button>
    <p><b>My ID (Share this with friend):</b> <span id="my-id-display" style="color: blue; font-weight: bold">...</span></p>
    <span id="status" style="color: red; margin-left: 10px">Disconnected</span>
</div>

<div class="box">
    <h3>2. Chat Room</h3>
    <label>Friend ID (Recipient UUID):</label><br>
    <input type="text" id="recipient" placeholder="Paste friend's UUID here..."><br>

    <label>Message:</label><br>
    <input type="text" id="message" placeholder="Type hello..."><br>
    <button onclick="sendMessage()">Send</button>
</div>

<h3>Messages:</h3>
<ul id="messages"></ul>

<script type="text/javascript">
    var stompClient = null;
    var myUserId = null;

    function connect() {
        var jwtToken = document.getElementById('token').value.trim();
        if (!jwtToken) {
            alert("Vui lòng nhập JWT Token!");
            return;
        }

        // --- 1. Hiển thị ID để biết mình là ai ---
        try {
            var payload = parseJwt(jwtToken);
            // 👇 SỬA Ở ĐÂY: Lấy accountId thay vì sub
            myUserId = payload.accountId;
            document.getElementById('my-id-display').innerText = myUserId;
            console.log("My User ID form Token: " + myUserId);
        } catch (e) {
            console.error("Lỗi parse token:", e);
        }

        // --- 2. Kết nối WebSocket ---
        var socket = new SockJS('http://localhost:8080/api/chat/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({ 'Authorization': 'Bearer ' + jwtToken }, function (frame) {
            document.getElementById('status').innerText = "Connected ✅";
            document.getElementById('status').style.color = "green";
            console.log('Connected: ' + frame);

            // --- 3. Đăng ký nhận tin (Subscribe) ---
            // Đường dẫn này chuẩn rồi, Spring sẽ tự map vào session của mình
            stompClient.subscribe('/user/queue/messages', function (msg) {
                console.log("📩 Tin nhắn tới:", msg.body);
                var body = JSON.parse(msg.body);
                showMessage(body.senderId + ": " + body.content);
            });

        }, function(error) {
            console.error(error);
            document.getElementById('status').innerText = "Error ❌";
            alert("Kết nối thất bại! Hãy check Console F12 và xem lại Token/Server.");
        });
    }

    function sendMessage() {
        var recipientId = document.getElementById('recipient').value.trim();
        var content = document.getElementById('message').value;

        if(!stompClient) { alert("Chưa kết nối!"); return; }
        if(!recipientId) { alert("Chưa nhập ID người nhận!"); return; }

        var chatMessage = {
            recipientId: recipientId,
            content: content
        };

        stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));

        // Hiện tin nhắn của mình (Client-side echo)
        showMessage("Me: " + content);
        document.getElementById('message').value = ''; // Xóa ô nhập cho tiện
    }

    function showMessage(text) {
        var ul = document.getElementById('messages');
        var li = document.createElement('li');
        li.appendChild(document.createTextNode(text));
        ul.appendChild(li);
        console.log("Displaying: " + text);
    }

    function parseJwt (token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }
</script>
</body>
</html>
