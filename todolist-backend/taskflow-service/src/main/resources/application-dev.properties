# ====== Kafka Bootstrap Server ======
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
# ====== Producer Config ======
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
# ====== Topic Config ======
app.kafka.topic.taskflow.notification.project-member-added=taskflow.notification.project-member-added.v1
app.kafka.topic.taskflow.notification.project-member-role-updated=taskflow.notification.project-member-role-updated.v1
app.kafka.topic.taskflow.notification.task-assigned=taskflow.notification.task-assigned.v1
app.kafka.topic.taskflow.notification.task-commented=taskflow.notification.task-commented.v1
app.kafka.topic.taskflow.notification.task-updated=taskflow.notification.task-updated.v1
app.kafka.topic.taskflow.notification.task-completed=taskflow.notification.task-completed.v1
app.kafka.topic.taskflow.notification.task-reopened=taskflow.notification.task-reopened.v1
app.kafka.topic.taskflow.notification.task-due-soon=taskflow.notification.task-due-soon.v1
app.kafka.topic.taskflow.notification.task-overdue=taskflow.notification.task-overdue.v1
app.kafka.topic.taskflow.notification.project-deleted=taskflow.notification.project-deleted.v1
app.kafka.topic.taskflow.notification.response-invitation=taskflow.notification.response-invitation.v1
