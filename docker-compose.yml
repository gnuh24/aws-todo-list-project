version: "3.9"

services:
  mysql:
    image: mysql:8.0.36
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: aws_todolist_database
    ports:
      - "3306:3306"
    volumes:
      - ./todolist-database/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2.4
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./todolist-database/redis-init.sh:/usr/local/bin/redis-init.sh
    command: ["sh", "/usr/local/bin/redis-init.sh"]

  # =====================
  # Zookeeper (Official)
  # =====================
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok,stat
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog

  # =====================
  # Kafka 3.5 (Bitnami)
  # =====================
  kafka:
    image: bitnamilegacy/kafka:3.5
    container_name: kafka_broker
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # External listener
      - "29092:29092" # Internal listener (cho Redpanda)
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes

      # ⚙️ 2 listener: internal (cho docker network) và external (cho host)
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka_broker:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/bitnami/kafka

  # =====================
  # Redpanda Console (UI)
  # =====================
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda_console
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8083:8080"  # Console UI tại http://localhost:8083
    environment:
      - KAFKA_BROKERS=kafka_broker:29092  # Dùng listener nội bộ (ổn định nhất)

volumes:
  mysql_data:
  redis_data:
  zookeeper_data:
  zookeeper_datalog:
  kafka_data:
