version: "3.9"

services:
  mysql:
    image: mysql:8.0.36
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: aws_todolist_database
    ports:
      - "3306:3306"
    volumes:
      - ./todolist-database/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2.4
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./todolist-database/redis-init.sh:/usr/local/bin/redis-init.sh
    command: ["sh", "/usr/local/bin/redis-init.sh"]

volumes:
  mysql_data:
  redis_data:
