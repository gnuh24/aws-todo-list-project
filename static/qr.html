<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>2FA QR Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: #020617;
            padding: 24px;
            border-radius: 12px;
            width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-bottom: 8px;
        }

        .secret {
            margin-top: 12px;
            padding: 8px;
            background: #111827;
            border-radius: 6px;
            font-family: monospace;
            word-break: break-all;
            font-size: 13px;
        }

        #qrcode {
            margin-top: 20px;
        }

        small {
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Google Authenticator 2FA</h2>
        <small>Quét QR bằng Google Authenticator</small>

        <div id="qrcode"></div>


        <div class="secret">
            IJJ6JWQOEYZYCCAX77WY6CTFJXVFCLXL
        </div>
    </div>

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        const otpAuthUrl =
            "otpauth://totp/AWS-Todolist:user1@gmail.com?secret=GVUVDSRFEOS2ML3MO7KZOH6VOTPSOG5F&issuer=AWS-Todolist&algorithm=SHA1&digits=6&period=30";

        new QRCode(document.getElementById("qrcode"), {
            text: otpAuthUrl,
            width: 200,
            height: 200,
            margin: 10,
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>

</body>

</html>
